name: macOS preview

on:
  push:
    branches: [codex/patchlook-macos-preview]

permissions:
  contents: read

jobs:
  build:
    name: macOS preview (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --locked --release
      - name: Build and verify the preview DMG
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          python scripts/package.py

          images=(dist/*.dmg)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          hdiutil verify "$image"

          mount_dir="$(mktemp -d)"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          app="$mount_dir/Patchlook.app"
          test "$(lipo -archs "$app/Contents/MacOS/patchlook")" = "$EXPECTED_ARCH"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -extract LSMinimumSystemVersion raw -o - "$app/Contents/Info.plist"
          hdiutil detach "$mount_dir"
          trap - EXIT

          cd dist
          image="$(basename "$image")"
          shasum -a 256 "$image" | tee "$image.sha256"
          {
            printf '### Apple Silicon DMG\n\n'
            printf '`%s`\n' "$(cat "$image.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: patchlook-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
